openapi: 3.1.0

info:
  title: hiyocord Nexus
  version: 1.0.0
  description: API documentation for hiyocord Nexus, a service for managing Discord interactions.

servers:
  - url: https://nexus.hiyocord.org
    description: Official Production server

paths:
  /interactions:
    description: "Discord interaction"

  /api/manifests:
    description: "Get list of registered manifests"
    get:
      tags:
        - Web API
      summary: "List all registered manifests"
      responses:
        '200':
          description: "Successfully retrieved manifests list"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManifestLatestVersion'
        default:
          description: "Server error"

    post:
      description: "Endpoint to submit manifest from service workers"
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: '#/components/schemas/ManifestAnyVersion'
      responses:
        '200':
          description: "ok"
        '400':
          description: "Invalid input data"
        default:
          description: "Server error"

  /api/manifests/{id}:
    description: "Get or delete a specific manifest"
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: "Manifest ID"
    get:
      tags:
        - Web API
      summary: "Get manifest details"
      responses:
        '200':
          description: "Successfully retrieved manifest details"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestLatestVersion'
        '404':
          description: "Manifest not found"
        default:
          description: "Server error"
    delete:
      tags:
        - Web API
      summary: "Delete a manifest"
      responses:
        '200':
          description: "Successfully deleted manifest"
        '404':
          description: "Manifest not found"
        default:
          description: "Server error"

  /api/manifests/{id}/approve:
    description: "Approve a pending manifest"
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: "Manifest ID"
    post:
      tags:
        - Web API
      summary: "Approve manifest"
      responses:
        '200':
          description: "Successfully approved manifest"
        '404':
          description: "Manifest not found"
        default:
          description: "Server error"

  /api/manifests/{id}/reject:
    description: "Reject a pending manifest"
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: "Manifest ID"
    post:
      tags:
        - Web API
      summary: "Reject manifest"
      responses:
        '200':
          description: "Successfully rejected manifest"
        '404':
          description: "Manifest not found"
        default:
          description: "Server error"

  /.well-known/nexus-public-key:
    description: "Endpoint to retrieve Nexus public key for signature verification"
    get:
      responses:
        '200':
          description: "Successfully retrieved Nexus public key"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NexusPublicKey'
        default:
          description: "Server error"

  /api/auth/discord/authorize:
    description: "Discord OAuth2 authorization redirect endpoint"
    get:
      tags:
        - Web API
      summary: "Redirect to Discord OAuth2 authorization page"
      parameters:
        - name: origin
          in: query
          required: true
          schema:
            type: string
          description: "Frontend origin (window.location.origin)"
      responses:
        '302':
          description: "Redirect to Discord OAuth2 authorization page"
        '400':
          description: "Invalid origin parameter"
        default:
          description: "Server error"

  /api/auth/discord:
    description: "Discord OAuth2 authentication endpoint"
    post:
      tags:
        - Web API
      summary: "Exchange Discord OAuth2 code for access token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: "OAuth2 authorization code from Discord"
                redirect_uri:
                  type: string
                  description: "Redirect URI used in the OAuth2 flow"
              required:
                - code
                - redirect_uri
      responses:
        '200':
          description: "Successfully authenticated. JWT is set in HttpOnly Cookie."
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    description: "Discord user information"
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      discriminator:
                        type: string
                      avatar:
                        type: string
        '401':
          description: "Authentication failed"
        default:
          description: "Server error"

  /api/auth/me:
    description: "Get current authenticated user"
    get:
      tags:
        - Web API
      summary: "Get current user information"
      responses:
        '200':
          description: "Successfully retrieved user information"
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        description: "Discord User ID"
        '401':
          description: "Unauthorized"
        default:
          description: "Server error"

  /api/auth/logout:
    description: "Logout and clear authentication cookie"
    post:
      tags:
        - Web API
      summary: "Logout user"
      responses:
        '200':
          description: "Successfully logged out. Cookie is cleared."
          content:
            application/json:
              schema:
                type: object
        default:
          description: "Server error"

